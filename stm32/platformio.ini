; PlatformIO project: STM32L412KB (NUCLEO-L412KB) PHCSSM RSNN deployment.
; Separate project from microbit_c_port/ to enable parallel pio runs.

[platformio]
default_envs = stm32_heart_seed2345
src_dir = src

[env]
platform = ststm32
board = nucleo_l412kb
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
upload_flags =
    -c
    adapter serial 066CFF575353898667181319
build_unflags = -Os
build_flags =
    -O3
    -Wno-unused-variable
    -Wno-unused-function

[env:stm32_heart_seed2345]
extends = env
build_flags = ${env.build_flags} -DRSNN_VARIANT_INC=\"weights/rsnn_weights_heart_seed2345.h\"

; =====================================================================
; Power-measurement build variants (for AD3 / multimeter)
; - *_power_loop : continuous inference with synthetic input
; - stm32_idle_baseline : __WFI() forever, MCU clocks on, no compute
; =====================================================================

[env:stm32_idle_baseline]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_heart_seed2345.h\"
    -DPOWER_MEASURE_IDLE

[env:stm32_heart_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_heart_seed2345.h\"
    -DPOWER_MEASURE_LOOP

[env:stm32_scp1_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_scp1_seed2345.h\"
    -DPOWER_MEASURE_LOOP

[env:stm32_scp2_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_scp2_seed2345.h\"
    -DPOWER_MEASURE_LOOP

[env:stm32_ethanol_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_ethanol_seed2345.h\"
    -DPOWER_MEASURE_LOOP

[env:stm32_motor_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_motor_seed2345.h\"
    -DPOWER_MEASURE_LOOP

[env:stm32_worms_seed2345_power_loop]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_worms_seed2345.h\"
    -DPOWER_MEASURE_LOOP

; =====================================================================
; 80 MHz HSI + PLL versions of the above (for comparison with default
; low-power clock). Forces SYSCLK = 80 MHz independent of USB/HSE.
; =====================================================================

[env:stm32_idle_baseline_80mhz]
extends = env
build_flags = ${env.build_flags}
    -DRSNN_VARIANT_INC=\"weights/rsnn_weights_heart_seed2345.h\"
    -DPOWER_MEASURE_IDLE
    -DFORCE_80MHZ_HSI_PLL

